[project]
name = "e-rag"
version = "0.1.0"
description = "RAG pipeline with hierarchical document retrieval"
readme = "README.md"
authors = [
    { name = "damvolkov", email = "damvolkovv@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "haystack-ai>=2.12",
    "pgvector-haystack>=6.0",
    "docling-haystack>=0.1.1",
    "sentence-transformers>=3.4",
    "pydantic-settings>=2.7",
    "orjson>=3.10",
    "typer>=0.15",
    "rich>=13.9",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[project.scripts]
e-rag = "e_rag.__main__:app"
